name: tests

on:
  push:
  pull_request:

jobs:
  unit-contract:
    name: unit + contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install shellcheck + bats + tmux
        # tmux is explicit, never assumed from the runner image — without it
        # the rescue-session survival test skips and CI goes green unproven.
        run: sudo apt-get update && sudo apt-get install -y shellcheck bats tmux
      - name: Unit tests
        run: npm run test:unit
      - name: Contract tests
        run: npm run test:contract

  e2e:
    name: docker e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Docker e2e
        run: npm run test:e2e
